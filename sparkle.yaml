// =======================================================================
// III. 主逻辑函数
// =======================================================================
/**
 * @param {object} config - 原始的 Clash 配置文件对象。
 * @returns {object} - 处理并修改后的新 Clash 配置文件对象。
 */
function main(config) {
  // 如果在脚本顶部的总开关是关闭的，则立即返回原始配置，不进行任何修改。
  if (!enable) return config;

  // 健壮性检查：确保配置文件中至少有一个代理节点，否则后续逻辑无法执行。
  const proxyCount = config?.proxies?.length ?? 0;
  if (proxyCount === 0) {
    throw new Error('配置文件中未找到任何代理节点 (config.proxies is empty)');
  }

  // --- 1. 核心基础配置覆写 ---
  // 这部分会强制覆盖原始配置文件中的一些基础设置，以确保脚本生成的新配置能在一个预期的、一致的环境下工作。
  config['allow-lan'] = true;              // 允许局域网设备连接 Clash
  config['bind-address'] = '*';            // 监听所有网络接口，使得局域网设备可以访问
  config['mode'] = 'rule';                 // 强制设置为规则模式
  config['profile'] = { 'store-selected': true, 'store-fake-ip': true }; // 持久化UI中的节点选择和fake-ip映射
  config['geodata-loader'] = 'memconservative'; // 使用内存保守的 geodata 加载器，适合小内存设备

  // DNS 配置：启用并配置 fake-ip 模式以获得最佳兼容性，同时为国内外域名设置不同的上游DNS服务器。
  config['dns'] = {
    'enable': true,
    'listen': ':1053',
    'ipv6': true,
    'enhanced-mode': 'fake-ip',
    'fake-ip-range': '198.18.0.1/16',
    'nameserver': [...foreignDNS],
    'proxy-server-nameserver': [...foreignDNS],
    'nameserver-policy': {
      'geosite:private': 'system', // 私有地址和域名（如路由器管理页面）使用系统DNS
      'geosite:cn,apple@cn,microsoft@cn': chinaDNS, // 国内相关域名使用国内DNS
    },
  };
  
  // 在此可以添加其他需要覆写的核心配置，例如 sniffer, tun, ntp 等。

  // --- 2. 动态生成区域策略组 ---
  // 此部分代码负责实现 `regionOptions` 中定义的自动节点分组功能。
  let regionProxyGroups = []; // 存放成功创建的区域策略组
  let otherProxyGroups = config.proxies.map(p => p.name); // 初始化一个包含所有节点名称的列表，用于后续筛选

  regionOptions.regions.forEach(region => {
    // 根据正则表达式和倍率限制筛选出符合条件的节点
    const proxies = config.proxies
      .filter(p => {
        // 使用正则表达式从节点名称中提取倍率。例如 "x1.5", "倍率2", "X3"
        const multiplier = /(?<=[xX✕✖⨉倍率])(\d+(?:\.\d+)?)/i.exec(p.name)?.[1];
        // 节点必须同时满足：1. 名称匹配区域正则 2. 提取出的倍率不高于限制（如果没有倍率则视为0）
        return p.name.match(region.regex) && parseFloat(multiplier || '0') <= region.ratioLimit;
      })
      .map(p => p.name);

    // 如果找到了至少一个符合条件的节点，则创建该区域的策略组
    if (proxies.length > 0) {
      regionProxyGroups.push({
        ...groupBaseOption,      // 继承通用配置
        name: region.name,       // 策略组名称
        type: 'url-test',        // 类型为 url-test，自动选择延迟最低的节点
        tolerance: 50,           // 延迟容差，50ms内的延迟波动不切换节点
        icon: region.icon,       // 图标
        proxies: proxies,        // 包含的节点列表
      });
      // 从 `otherProxyGroups` 列表中移除已经被分配到这个区域组的节点
      otherProxyGroups = otherProxyGroups.filter(name => !proxies.includes(name));
    }
  });
  // 提取所有成功创建的区域组的名称，方便后面引用
  const regionProxyGroupNames = regionProxyGroups.map(g => g.name);

  // --- 3. 初始化规则、Providers 和策略组的容器 ---

  const rules = [...temporaryRules, 'PROCESS-NAME,SunloginClient,DIRECT', 'PROCESS-NAME,SunloginClient.exe,DIRECT']; // 预置一些特殊规则
  const ruleProviders = new Map(); // 使用 Map 存储 rule-provider，可以有效防止重名覆盖
  let serviceProxyGroups = [];     // 存放由 serviceDefinitions 生成的服务策略组

  // --- 4. 数据驱动：循环生成服务策略组和规则 ---
  // 这是脚本的核心循环，它将 `serviceDefinitions` 中定义的蓝图，转化为实际的 Clash 配置。
  // 为所有服务组定义一个默认的代理列表，包含了"默认节点"、所有区域组、以及一个可能的"其他节点"组和"直连"。
  const defaultServiceProxies = ['默认节点', ...regionProxyGroupNames, ...(otherProxyGroups.length > 0 ? ['其他节点'] : []), '直连'];

  serviceDefinitions.forEach(service => {
    // 根据 `ruleOptions` 的开关状态，判断是否要处理当前服务
    if (ruleOptions[service.key]) {
      
      // A. 生成规则: 遍历服务定义中的 rules 数组
      service.rules.forEach(rule => {
        const parts = rule.split(',');
        // 检查规则是否已经自带了策略组。Clash规则格式为 `TYPE,VALUE,POLICY`。
        // 如果逗号分割后部件少于3个，说明原始规则缺少 POLICY 部分。
        const targetGroup = parts.length < 3 ? `,${service.name}` : '';
        // 将完整的规则（可能已自动补全策略组）推入总规则列表
        rules.push(`${rule}${targetGroup}`);
      });

      // B. 生成 Rule Providers: 如果服务定义中包含了 providers，则将其添加到 ruleProviders 容器中
      if (service.providers) {
        for (const [name, providerConfig] of Object.entries(service.providers)) {
          // 合并通用配置和特定配置
          ruleProviders.set(name, { ...ruleProviderCommon, ...providerConfig });
        }
      }
      
      // C. 生成策略组: 为该服务创建一个 `select` 类型的策略组
      const group = { 
        ...groupBaseOption, 
        name: service.name, 
        type: 'select', 
        // 优先使用服务自定义的代理列表，如果没有，则使用上面定义的 `defaultServiceProxies`
        proxies: service.proxies || defaultServiceProxies 
      };
      if (service.url) group.url = service.url; // 如果有自定义健康检查URL，则覆盖默认值
      if (service.icon) group.icon = service.icon; // 如果有图标，则添加
      serviceProxyGroups.push(group);
    }
  });

  // --- 5. 定义核心功能策略组 ---
  // 这些是与具体服务无关，但对整体体验至关重要的策略组，如国内网站、下载等。
  const coreProxyGroups = [
    { ...groupBaseOption, name: '下载软件', type: 'select', proxies: ['直连', 'REJECT', '默认节点', ...regionProxyGroupNames], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Download.png' },
    { ...groupBaseOption, name: '其他外网', type: 'select', proxies: ['直连', '默认节点', ...regionProxyGroupNames], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Streaming!CN.png' },
    { ...groupBaseOption, name: '国内网站', type: 'select', proxies: ['直连', '默认节点', ...regionProxyGroupNames], url: 'http://wifi.vivo.com.cn/generate_204', icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/StreamingCN.png' },
  ];
  
  // --- 6. 定义 "默认节点" 和 "其他节点" 策略组 ---
  // "默认节点" 是一个顶层选择组，包含了所有区域组和 "其他节点" 组，方便快速切换全局出口区域。
  const defaultProxyGroup = { ...groupBaseOption, name: '默认节点', type: 'select', proxies: [...regionProxyGroupNames, ...(otherProxyGroups.length > 0 ? ['其他节点'] : []), '直连'], icon: 'https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png' };
  
  let otherNodesGroup = null;
  // 如果经过区域筛选后，仍然有未被分组的节点，则为它们创建一个 "其他节点" 组。
  if (otherProxyGroups.length > 0) {
    otherNodesGroup = { ...groupBaseOption, name: '其他节点', type: 'select', proxies: otherProxyGroups, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/World_Map.png' };
  }

  // --- 7. 组合最终的策略组列表 (按指定顺序) ---
  // 策略组在 Clash UI 中的显示顺序由它们在此数组中的位置决定。
  // 合理的排序可以极大地提升使用体验。
  config['proxy-groups'] = [
    defaultProxyGroup,       // 1. "默认节点" 置顶，作为最重要的全局切换入口。
    ...serviceProxyGroups,   // 2. 所有具体服务的策略组，方便针对性地为不同服务选择节点。
    ...coreProxyGroups,      // 3. 核心功能组，如国内、下载等。
    ...regionProxyGroups,    // 4. 所有自动生成的区域组，这些是实际的测速组。
    ...(otherNodesGroup ? [otherNodesGroup] : []) // 5. "其他节点" 组（如果存在的话）放在最后。
  ];
  
  // --- 8. 添加最终规则和静态 Rule Provider ---
  // 这些规则是规则列表的“兜底”规则，决定了所有未被前面服务规则匹配到的流量的最终去向。
  // 规则的匹配顺序是自上而下的。
  rules.push(
    'RULE-SET,applications,下载软件',
    'GEOSITE,private,DIRECT',              // 私有地址相关域名，直连 (例如 `*.local`)
    'GEOIP,private,DIRECT,no-resolve',     // 私有IP地址段，直连 (例如 192.168.x.x)
    'GEOSITE,cn,国内网站',                 // 国内网站域名，走“国内网站”策略组
    'GEOIP,cn,国内网站,no-resolve',        // 国内IP地址段，走“国内网站”策略组
    'MATCH,其他外网'                       // 所有其他未匹配的流量（即最终的默认行为），走“其他外网”策略组
  );
  // 为上面的 `applications` 规则添加对应的 rule-provider
  ruleProviders.set('applications', { ...ruleProviderCommon, behavior: 'classical', format: 'text', url: 'https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/applications.list', path: './ruleset/DustinWin/applications.list' });

  // --- 9. 最终整合并返回配置 ---
  // 确保配置中有一个名为 "直连" 的内置代理，因为很多策略组都引用了它。
  // 注意：脚本不应该修改原始的 `config.proxies` 列表，这里只是为了确保 `直连` 存在。
  // 更好的做法是依赖于Clash内核会自动处理内置策略。此行可视为保险措施。
  config.proxies.push({ name: '直连', type: 'direct', udp: true }); // 注：通常不需要手动添加
  
  // 将处理好的规则列表和规则提供者对象，赋值回 config 对象
  config['rules'] = rules;
  config['rule-providers'] = Object.fromEntries(ruleProviders); // 将 Map 转换为 Clash 需要的普通对象格式

  // 返回最终构建完成的、包含了所有自定义逻辑的配置对象
  return config;
}
