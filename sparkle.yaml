 * - 如果规则已包含策略组 (如 'GEOSITE,microsoft@cn,国内网站')，则保持不变。
 * - providers: (可选) 对象，如果服务需要额外的 `rule-provider`，在这里定义。键是 provider 名称，值是其配置。
 * - proxies: (可选) 数组，自定义此服务策略组内的代理列表。如果未定义，将使用下面主逻辑中创建的 `defaultProxies` 默认列表。
 */
